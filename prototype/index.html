<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII Poem Typewriter</title>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--bg:#eee2cc;--ink:#3a2e22;--faint:rgba(90,65,40,.35);--paper:#faf4e4;--paperink:#2e241a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1812;--ink:#e6d8bd;--faint:rgba(230,216,189,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1812;--ink:#e6d8bd;--faint:rgba(230,216,189,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Courier Prime","Courier New",monospace;font-size:16px}
#root{height:100%}
.app{height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center}
.bar{display:flex;gap:.6rem;padding:.7rem;flex-wrap:wrap;justify-content:center;align-items:center}
button{font:inherit;background:transparent;color:var(--ink);border:1px solid var(--ink);padding:.15rem .8rem;cursor:pointer}
button.on,button:hover{background:var(--ink);color:var(--bg)}
label{display:flex;align-items:center;gap:.4rem}
input[type=range]{accent-color:var(--ink);width:8rem}
.stage{flex:1;min-height:540px;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:0;padding-bottom:.5rem}
.art{flex:1;padding-bottom:.8rem;display:flex;align-items:center;margin:0;white-space:pre;line-height:1.15;font-size:clamp(.8rem,3.2vw,1.2rem);max-width:100%;overflow-x:auto}
.cap{opacity:.6;font-size:.85rem;padding-bottom:.4rem}

.tw3d{position:relative;z-index:2;width:70em;font-size:clamp(4px,1.4vw,10px);margin:0 auto}
.roller{position:relative;width:62em;height:4.6em;margin:0 auto -1.4em;z-index:3}
.cyl{position:absolute;inset:0;border-radius:2.3em;background:linear-gradient(#e4dcc8,#a39b86 35%,#3f3a2e 72%,#8d8571);box-shadow:0 .5em .8em rgba(0,0,0,.4)}
.knob{position:absolute;top:-.6em;width:5.8em;height:5.8em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6a665a,#26231c 70%);box-shadow:0 .5em .7em rgba(0,0,0,.45),inset 0 0 0 .35em #15130f}
.knob::after{content:"";position:absolute;inset:1.1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8cfb6,#7d745e)}
.knob.l{left:-3.6em}.knob.r{right:-3.6em}
.body{position:relative;padding:3em 0 3.4em;clip-path:polygon(4% 0,96% 0,100% 100%,0 100%);background:linear-gradient(180deg,#78a39b 0,#55827a 30%,#3f6862 100%)}
.body::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.28),transparent 7%,transparent 93%,rgba(0,0,0,.28)),linear-gradient(180deg,rgba(255,255,255,.35),transparent 3em)}
.grille{height:2.6em;width:76%;margin:0 auto .9em;border-radius:.5em;background:repeating-linear-gradient(90deg,#17211f 0 .35em,#2f4743 .35em .95em);box-shadow:inset 0 .4em .6em rgba(0,0,0,.6),0 .15em 0 rgba(255,255,255,.3)}
.plate{width:20em;margin:0 auto 1.2em;text-align:center;padding:.5em 0;border-radius:.4em;background:linear-gradient(#efe5cc,#c4b692);box-shadow:0 .2em .4em rgba(0,0,0,.4);color:#3a2e22}
.plate span{font:700 1.3em "Courier Prime","Courier New",monospace}
.krow{display:flex;justify-content:center;margin-bottom:1em;position:relative}
.key{width:3.6em;height:3.6em;margin:0 .4em;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#fffaf0,#efe6d0 55%,#cfc3a6);border:.28em solid #26241f;color:#26241f;box-shadow:0 .55em 0 #14130f,0 1em .7em rgba(0,0,0,.45),inset 0 .15em .2em rgba(255,255,255,.85)}
.key span{font:700 1.5em/1 "Courier Prime","Courier New",monospace}
.key.wide{width:7.4em;border-radius:1.8em}
.key.wide span{font-size:1em;letter-spacing:.05em}
.key.space{width:34em;height:3em;border-radius:1.5em}
.key.down{transform:translateY(.5em);box-shadow:0 .05em 0 #14130f,0 .3em .4em rgba(0,0,0,.4),inset 0 .15em .3em rgba(0,0,0,.25);background:radial-gradient(circle at 35% 30%,#efe6d0,#cfc3a6)}
.base{position:relative;width:66em;height:1.6em;margin:-.2em auto 0;border-radius:0 0 1em 1em;background:linear-gradient(#2a2822,#0f0e0b);box-shadow:0 .8em 1em rgba(0,0,0,.35)}
.base::before,.base::after{content:"";position:absolute;bottom:-.7em;width:6em;height:.9em;border-radius:0 0 .6em .6em;background:#0b0a08}
.base::before{left:4em}.base::after{right:4em}
.pholder{position:relative;z-index:1}
.pwrap{position:relative;width:min(34rem,86vw);margin:0 auto -1.4rem;font-family:"Special Elite","Courier New",monospace;font-size:clamp(.95rem,3.6vw,1.25rem);line-height:1.7;color:var(--paperink);transform:rotate(-.25deg);filter:drop-shadow(0 2px 7px rgba(60,40,20,.4))}
.pwin::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.2rem;z-index:2;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(70,45,20,.3))}
.psheet{flex:none;animation:adv .35s ease-out}
@keyframes adv{from{transform:translateY(1.7em)}}
.pstub{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(34rem,86vw);height:.8rem;opacity:0;z-index:2;background:var(--grain),#faf4e4;clip-path:polygon(0 60%,4% 20%,9% 55%,15% 10%,22% 50%,30% 15%,38% 55%,47% 20%,55% 60%,63% 15%,72% 50%,80% 20%,88% 55%,94% 25%,100% 55%,100% 100%,0 100%)}
.ripping .pstub{opacity:1}
.ripping .pwrap{animation:rip 1.2s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes rip{0%{transform:rotate(-.25deg)}12%{transform:translateY(-.5em) rotate(.8deg)}24%{transform:translateY(-.2em) rotate(-1deg)}36%{transform:translateY(-.6em) rotate(.6deg)}100%{transform:translate(40vw,-90vh) rotate(22deg);opacity:0}}
.reader{flex:1;width:100%;display:flex;justify-content:center;padding:1rem 0 2.5rem}
.bigshadow{filter:drop-shadow(0 .6rem .9rem rgba(60,40,20,.4));animation:land .9s cubic-bezier(.2,.8,.2,1);height:fit-content}
@keyframes land{from{transform:translateY(55vh) rotate(10deg) scale(.5);opacity:0}}
.bigsheet{width:min(36rem,92vw);box-sizing:border-box;padding:2.4rem 2rem 3.6rem;color:var(--paperink);font-family:"Special Elite","Courier New",monospace;background:var(--grain),linear-gradient(90deg,rgba(0,0,0,.06),transparent 6%,transparent 94%,rgba(0,0,0,.06)),#faf4e4;transform:rotate(-.6deg);clip-path:polygon(0 0,100% 0,100% 99%,97% 99.6%,93% 98.4%,88% 99.7%,83% 98.6%,78% 99.5%,72% 98.3%,66% 99.6%,60% 98.5%,54% 99.7%,48% 98.4%,42% 99.5%,36% 98.5%,30% 99.7%,24% 98.4%,18% 99.6%,12% 98.5%,6% 99.5%,0 98.8%)}
.bigsheet h2{margin:0 0 1rem;text-align:center;font-weight:400;font-size:1.7rem;letter-spacing:.08em}
.rart{margin:1.4rem auto .6rem;width:fit-content;max-width:100%;overflow-x:auto;white-space:pre;line-height:1.15;font-family:"Courier Prime","Courier New",monospace;font-size:clamp(.7rem,2.8vw,1rem)}
.rlines{margin:0 auto 1rem;width:fit-content;white-space:pre;font:1.15rem/1.7 "Special Elite","Courier New",monospace}
.rfoot{text-align:center;margin-top:1.6rem;opacity:.6}
.pwin{position:relative;box-sizing:border-box;height:calc(7em + 1.9rem);padding:0 1.4em 1.9rem;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;background:var(--grain),linear-gradient(90deg,rgba(0,0,0,.07),transparent 8%,transparent 92%,rgba(0,0,0,.07)),#faf4e4;clip-path:polygon(0 0,100% 0,100% 0,100% 100%,0 100%,0 0);transition:clip-path .5s}
.folded .pwin{clip-path:polygon(2.5% 0,97.5% 0,100% 2.4em,100% 100%,0 100%,0 2.4em)}
.pwin::before{content:"";position:absolute;left:0;right:0;top:0;height:3em;z-index:2;pointer-events:none;opacity:0;transition:opacity .5s;background:linear-gradient(180deg,rgba(90,65,35,.55),rgba(90,65,35,.2) 45%,rgba(90,65,35,0))}
.pcurl{position:absolute;z-index:3;left:1.5%;width:97%;top:-.95em;height:1.9em;opacity:0;transition:opacity .4s;border-radius:1.1em 1.1em 0 0 / .95em .95em 0 0;background:var(--grain),linear-gradient(180deg,#bfae85 0,#f6eed9 24%,#e4d7b7 46%,#b3a380 78%,#a2927a 100%)}
.folded .pcurl{opacity:1}
.folded .pwin::before{opacity:1}
.pline{white-space:pre;transform-origin:top}
.pline span{position:relative}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const { useState, useEffect, useCallback } = React;
const html = htm.bind(React.createElement);

/* ---------- data ---------- */
const poems = [
  { id: "moon", title: "Night Window", stanzas: [
    { lines: ["The moon leans on the glass", "and waits for me to sleep."], art: String.raw`
      _..._
    .::::::.
   :::::::::
   '::::::'
     '""'` },
    { lines: ["Somewhere a clock forgets", "the number that comes next."], art: String.raw`
     .-"""""-.
    /  12     \
   | 9   o  3 |
    \    6    /
     '-.....-'` },
  ]},
  { id: "sea", title: "Low Tide", stanzas: [
    { lines: ["The sea pulls back its hands", "and shows what it has kept."], art: String.raw`
   ~  ~~   ~   ~~  ~
 ~~   ~  ~~~  ~   ~~
   ~~    ~~     ~  ~
 ~    ~~    ~~~   ~~` },
    { lines: ["A shell, a coin, a name", "written small in sand."], art: String.raw`
       ___
     .'   '.
    /  .-.  \
   |  (   )  |
    \  '-'  /
     '-...-'` },
  ]},
];

/* ---------- typing engine ---------- */
function useTypewriter(text, base, paused) {
  const [index, setIndex] = useState(0);
  useEffect(() => {
    if (paused || index >= text.length) return;
    const ch = text[index];
    const d = ch === "\n" ? base * 7 : ".,;:!?".includes(ch) ? base * 5 : base + Math.random() * base * 0.6;
    const t = setTimeout(() => setIndex(i => i + 1), d);
    return () => clearTimeout(t);
  }, [index, text, base, paused]);
  return { typed: text.slice(0, index), index, done: index >= text.length };
}

/* ---------- illustrated typewriter ---------- */
const ROWS = [
  { keys: "1234567890-'" },
  { keys: "QWERTYUIOP" },
  { keys: "ASDFGHJKL:", ret: true },
  { keys: "ZXCVBNM,.?" },
];
const ALIAS = { "!": "1", ";": ":", '"': "'" };
const norm = c => { if (c === "\n") return "RETURN"; if (c === " ") return "SPACE"; const u = c.toUpperCase(); return ALIAS[u] || u; };

function Typewriter({ ch, tick, base }) {
  const [down, setDown] = useState(null);
  useEffect(() => {
    if (!tick || !ch) return;
    setDown(norm(ch));
    const t = setTimeout(() => setDown(null), Math.max(50, Math.min(160, base * 0.8)));
    return () => clearTimeout(t);
  }, [tick]);
  const K = (k, cls) => html`<div key=${k} className=${"key" + (cls ? " " + cls : "") + (down === k ? " down" : "")}><span>${k}</span></div>`;
  return html`<div className="tw3d">
    <div className="roller"><i className="knob l"></i><div className="cyl"></div><i className="knob r"></i></div>
    <div className="body">
      <div className="grille"></div>
      <div className="plate"><span>T Y P E W R I T E R</span></div>
      ${ROWS.map((r, ri) => html`<div className="krow" key=${ri} style=${{ transform: "translateX(" + ri * 1.1 + "em)" }}>
        ${r.keys.split("").map(k => K(k))}${r.ret ? K("RETURN", "wide") : null}
      </div>`)}
      <div className="krow"><div className=${"key space" + (down === "SPACE" ? " down" : "")}></div></div>
    </div>
    <div className="base"></div>
  </div>`;
}

/* ---------- paper grain ---------- */
const GRAIN = "<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36 0 0 0 0 .26 0 0 0 0 .15 0 0 0 .2 0'/></filter><rect width='100%' height='100%' filter='url(#n)'/></svg>";
document.documentElement.style.setProperty("--grain", 'url("data:image/svg+xml,' + encodeURIComponent(GRAIN) + '")');

/* ---------- typed ink with tiny irregularities ---------- */
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function Ink({ text, offset = 0 }) {
  const out = [];
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (c === " ") { out.push(c); continue; }
    out.push(html`<span key=${i} style=${{ top: (rnd(i + offset) - 0.5) * 1.6 + "px", opacity: 0.78 + rnd(i + offset + 99) * 0.22 }}>${c}</span>`);
  }
  return out;
}

/* ---------- paper: feeds up, bends away at the top, tears off ---------- */
const V = 3;                                   // lines visible flat before the bend starts
const CURVE = [1, 1, 1, 0.55, 0.3, 0.14];      // line height factor by distance from the roller
function Paper({ text, ripping }) {
  const lines = text.split("\n"), n = lines.length;
  let off = 0;
  const rows = lines.map((ln, idx) => {
    const s = CURVE[Math.min(n - 1 - idx, CURVE.length - 1)], o = off;
    off += ln.length + 1;
    return html`<div className="pline" key=${idx} style=${{ height: s * 1.7 + "em", transform: "scaleY(" + s + ")", opacity: s < 1 ? 0.3 + s * 0.65 : 1 }}><${Ink} text=${ln} offset=${o} /></div>`;
  });
  return html`<div className=${"pholder" + (ripping ? " ripping" : "")}>
    <div className=${"pwrap" + (n > V ? " folded" : "")}>
      <div className="pcurl"></div>
      <div className="pwin"><div className="psheet" key=${n}>${rows}</div></div>
    </div>
    <div className="pstub"></div>
  </div>`;
}

/* ---------- reading view: the finished page ---------- */
function Reader({ poem }) {
  return html`<div className="reader"><div className="bigshadow"><div className="bigsheet">
    <h2>${poem.title}</h2>
    ${poem.stanzas.map((s, k) => html`<div key=${k}><pre className="rart">${s.art}</pre><pre className="rlines">${s.lines.join("\n")}</pre></div>`)}
    <div className="rfoot">~ fin ~</div>
  </div></div></div>`;
}

/* ---------- stage ---------- */
function Stage({ stanza, prefix, base, paused, onDone, ripping }) {
  const { typed, index, done } = useTypewriter(stanza.lines.join("\n"), base, paused);
  useEffect(() => {
    if (!done || paused || ripping) return;
    const t = setTimeout(onDone, 2200);
    return () => clearTimeout(t);
  }, [done, paused, onDone, ripping]);
  const text = (prefix ? prefix + "\n\n" : "") + typed;
  return html`<div className="stage">
    <pre className="art">${stanza.art}</pre>
    <${Paper} text=${text} ripping=${ripping} />
    <${Typewriter} ch=${typed[index - 1]} tick=${index} base=${base} />
  </div>`;
}

/* ---------- app ---------- */
function App() {
  const [p, setP] = useState(0);
  const [i, setI] = useState(0);
  const [paused, setPaused] = useState(false);
  const [run, setRun] = useState(0);
  const [speed, setSpeed] = useState(5);
  const [phase, setPhase] = useState("typing");
  const timer = React.useRef(null);
  const poem = poems[p];
  const base = Math.round(300 / speed);
  const prefix = poem.stanzas.slice(0, i).map(s => s.lines.join("\n")).join("\n\n");
  const next = useCallback(() => {
    if (i < poem.stanzas.length - 1) setI(n => n + 1);
    else { setPhase("ripping"); timer.current = setTimeout(() => setPhase("reading"), 1300); }
  }, [poem, i]);
  const restart = n => { clearTimeout(timer.current); if (n !== undefined) setP(n); setI(0); setPhase("typing"); setRun(r => r + 1); };
  return html`<div className="app">
    <div className="bar">
      ${poems.map((x, n) => html`<button key=${x.id} className=${n === p ? "on" : ""} onClick=${() => restart(n)}>${x.title}</button>`)}
      <button onClick=${() => setPaused(v => !v)}>${paused ? "▶ play" : "❚❚ pause"}</button>
      <button onClick=${() => restart()}>↺ replay</button>
      <label>speed <input type="range" min="1" max="10" value=${speed} onInput=${e => setSpeed(+e.target.value)} /> ${speed}</label>
    </div>
    ${phase === "reading"
      ? html`<${Reader} poem=${poem} />`
      : html`<${Stage} key=${p + "-" + i + "-" + run} stanza=${poem.stanzas[i]} prefix=${prefix} base=${base} paused=${paused} onDone=${next} ripping=${phase === "ripping"} />`}
    ${phase === "typing" ? html`<div className="cap">stanza ${i + 1}/${poem.stanzas.length}</div>` : null}
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
</script>
</body>
</html>
